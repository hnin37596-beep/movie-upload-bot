name: Movie Bot

on:
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Check FFmpeg
        run: |
          ffmpeg -version
          ffprobe -version

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install Python dependencies
        run: |
          python -m pip install "python-telegram-bot>=22,<23"
          python -m pip install "aiohttp>=3.10"
          python -m pip install "httpx>=0.27"
          python -m pip install "beautifulsoup4>=4.12"

      - name: Check BeautifulSoup
        run: |
          python -c "from bs4 import BeautifulSoup; print('BeautifulSoup OK')"

      - name: Start Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          python bot.py
